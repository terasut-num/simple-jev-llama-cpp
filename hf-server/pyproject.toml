# Build/install settings for the GGUF server; common stays a plain sibling source folder.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-jev"
version = "0.1.0"
description = "Standalone llama.cpp shared-prefix classifier API for GGUF models"
requires-python = ">=3.12"
dependencies = ["llama-cpp-python>=0.3.35", "pydantic>=2", "fastapi", "uvicorn", "numpy", "jinja2", "Pillow>=10.4"]

# Both this command and python -m hf_server call the same entry point.
[project.scripts]
simple-jev = "hf_server:main"

# Testing is optional at runtime; the GGUF backend tests use a tiny stubbed
# engine plus opt-in real-GGUF tests gated by SIMPLE_JEV_GGUF.
[project.optional-dependencies]
laya = ["laya==0.3.4"]
test = ["pytest", "pytest-asyncio", "httpx"]

# Include the shared modules in the wheel without introducing a separate
# common distribution. Build/install from a checkout containing both folders.
[tool.setuptools]
py-modules = ["hf_server", "hf_prompt_policies", "hf_vision", "hf_media"]
packages = ["common"]
package-dir = {"" = ".", common = "../common"}

# Resolve source imports from the repository root and this server directory.
# The shared tests can also be included explicitly when running pytest.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["..", "."]
